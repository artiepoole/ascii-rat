[workspace]
resolver = "2"
members = [
    "ascii-rat-stage",
    "ascii-rat-bard",
    "ascii-rat-scribe",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
# Internal crate: `path` is used for local builds, `version` is required to
# publish the dependent crates to crates.io. Keep this in lockstep with
# [workspace.package] version above.
ascii-rat-stage = { path = "ascii-rat-stage", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
portable-pty = "0.9"
rand = "0.10.2"
regex = "1"
anyhow = "1"
thiserror = "2"
rpassword = "7"
crossterm = "0.29"
